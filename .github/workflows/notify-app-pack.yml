name: Notify App Pack

# When a release is published here, rebuild the SideSuite App Pack so SP-01
# users get the update straight away instead of waiting for the pack's weekly
# cron. Nothing else in this repo depends on it — if this job fails, the
# release is still fine and the pack self-heals within a week.
#
# Triggers on the release *event*, so it fires however the release was cut:
# the web UI, `gh release create`, or the API.
on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the pack to rebuild
        env:
          # GITHUB_TOKEN cannot dispatch to a different repository. This is a
          # fine-grained PAT with contents:write on side-suite/fdroid-repo and
          # nothing else, stored as an ORGANISATION secret so all three app
          # repos share one copy.
          TOKEN: ${{ secrets.FDROID_DISPATCH_TOKEN }}
          # Passed through env, not interpolated into the shell, so a tag name
          # can never become part of the command.
          SRC_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Organisation secret FDROID_DISPATCH_TOKEN is not set." \
                 "The release published fine; the App Pack will pick it up on its" \
                 "weekly cron, or immediately via workflow_dispatch on fdroid-repo."
            exit 1
          fi

          # The pack build is stateless — it always fetches whatever is the
          # latest release of each app — so this payload is informational only.
          payload=$(jq -n --arg repo "$SRC_REPO" --arg tag "$TAG" \
            '{event_type: "app-released", client_payload: {repo: $repo, tag: $tag}}')

          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/side-suite/fdroid-repo/dispatches \
            -d "$payload"

          echo "Dispatched app-released for $SRC_REPO $TAG"
